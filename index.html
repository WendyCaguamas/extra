<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Museo 3D</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!-- Aquí conserva toda tu interfaz anterior -->

    <script type="module" src="script.js"></script>

</body>
</html>
<body>

    <div id="loading">
        <h2>Cargando museo...</h2>
        <p id="loading-text">Preparando mundo 3D</p>
    </div>

    <div id="interface">
        <div class="top-info">
            <h2>EXPLORACIÓN DEL MUSEO</h2>
            <span>Experiencia 3D</span>
        </div>

        <div class="crosshair">+</div>

        <div class="controls">
            <p><strong>CONTROLES</strong></p>
            <p>W A S D - Moverse</p>
            <p>↑ ↓ ← → - Moverse</p>
            <p>Mouse - Mirar alrededor</p>
            <p>ESC - Liberar cursor</p>
        </div>

        <div id="start-screen">
            <h1>MUSEO 3D</h1>
            <p>Explora el museo libremente.</p>
            <button id="start-button">ENTRAR AL MUSEO</button>
            <p class="small">WASD o flechas para caminar</p>
        </div>
    </div>

    <div id="error-message"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
